name: Första nyttan på mobil och desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-value:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: handymate-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:first-value-ui
      - run: npx playwright test tests/first-value-production.ui.spec.ts --no-deps --project=chromium --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-value-review
          path: handymate-dashboard/test-results/
