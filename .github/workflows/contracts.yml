# Kontraktsgrinden — browserlös, snabb, körs på VARJE push och PR.
#
# Bakgrund (2026-09-01): den fulla Playwright-sviten körde tidigare mot
# PRODUKTION (app.handymate.se, med service-role-nyckel) på varje push.
# Den sviten är värdefull men fel verktyg som push-grind: den tar ~20 min,
# kräver prod-hemligheter och läser prod-data. Den är nu nattlig
# (.github/workflows/playwright.yml). Den här grinden är det som ska vara
# rött INNAN något når main:
#
#   1. tsc — noll typfel
#   2. de browserlösa kontraktssviterna: källskanning + rena enhetstester,
#      inga sessioner, inga nätanrop, inga hemligheter
#
# Lägg till en svit här när den (a) inte behöver `page`/session och (b) låser
# ett kontrakt som ska hålla på main. tests/facit-ci-grind.spec.ts vaktar att
# filerna i listan finns och att den här workflowen fortsätter gälla push+PR.

name: Kontraktsgrind

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: TypeScript och kontrakt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: handymate-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, inte 20: supabase-js kräver native WebSocket (Node >=22) —
          # samma lärdom som playwright.yml.
          node-version: '22'

      - name: Install dependencies
        # npm install, inte npm ci: package-lock.json är gitignorerad i det
        # här repot (.gitignore rad 35), så det finns ingen låsfil att köra
        # ci mot. Samma val som den nattliga sviten.
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: TypeScript — noll fel
        run: npx tsc --noEmit

      - name: Browserlösa kontraktssviter
        # Inga browsers installeras — sviterna nedan får inte använda
        # `page`. En svit som behöver browser hör hemma i den nattliga
        # prod-sviten, inte här.
        run: >-
          npx playwright test
          tests/agent-team.spec.ts
          tests/approval-action-contract.spec.ts
          tests/column-contract.spec.ts
          tests/cron-auth.spec.ts
          tests/dead-code-paths.spec.ts
          tests/permission-contract.spec.ts
          tests/schema-contract.spec.ts
          tests/facit-ci-grind.spec.ts
          tests/facit-driftsynlighet.spec.ts
          tests/credit-watch.spec.ts
          tests/kortkvalitet.spec.ts
          tests/push-policy.spec.ts
          tests/facit-tenant-sweep.spec.ts
          tests/facit-route-auth-inventory.spec.ts
          tests/onboarding-funnel.spec.ts
          tests/push-tyst-tid.spec.ts
          tests/facit-ogrindade-automationer.spec.ts
          tests/aktivera-senare.spec.ts
          tests/genomgang-fore-betalning.spec.ts
          tests/kundminne-kanaler.spec.ts
          --no-deps
          --project=chromium
          --reporter=line
