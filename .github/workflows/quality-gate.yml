name: Outcome quality gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  quality-gate:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'QUALITY GATE:'))
    runs-on: ubuntu-latest
    steps:
      - name: Hämta PR-data och reviewkommentarer
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            require('fs').writeFileSync(
              process.env.RUNNER_TEMP + '/quality-gate-event.json',
              JSON.stringify({ pull_request: pr, __quality_gate_comments: comments }),
            );

      - uses: actions/checkout@v4

      - name: Verifiera proof contract och oberoende PASS
        env:
          GITHUB_EVENT_PATH: ${{ runner.temp }}/quality-gate-event.json
        run: node handymate-dashboard/scripts/quality-gate-check.mjs
