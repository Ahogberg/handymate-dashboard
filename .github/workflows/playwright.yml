# Nattlig prod-svit — hela Playwright-sviten mot app.handymate.se + det
# riktiga tvåtenant-RLS-beviset mot en disponibel databas.
#
# Historik: pausad 2026-05-08 ("testerna fungerar inte i prod-miljön") —
# det stämde då. Sedan dess har sviten reparerats i omgångar (Reality Week
# Pass 1+2, facit-svepet 2026-08-25) och är grön: 5205/5208 lokalt,
# där de 3 sista är SMS-debug-tester som medvetet EXKLUDERAS här (de
# skickar RIKTIGA SMS via 46elks — en grind som kostar pengar och pip i
# telefonen på varje push vore fel verktyg; de körs lokalt/manuellt).
#
# 2026-09-01: flyttad från push/PR till NATTLIG körning. Skälen:
#   - sviten kör mot PRODUKTION med service-role-nyckel — det ska inte
#     hända på varje PR från en feature-branch;
#   - ~20 min per push blev en grind ingen väntade på;
#   - push/PR-grinden är nu .github/workflows/contracts.yml (tsc + de
#     browserlösa kontraktssviterna, < 3 min, inga hemligheter).
# Rött här på morgonen = STOP-THE-LINE (docs/REALITY-WEEK.md): utred innan
# nästa push. workflow_dispatch finns kvar för att köra på begäran.
#
# Vad sviten kör: tsc + hela kontraktssviten (källskannings-facit + unit +
# live-smoke mot app.handymate.se). MEDVETET INTE next build — Vercel bygger
# redan varje push och är den riktiga deploy-grinden.
#
# Jobbet tenant-isolation kör tests/tenant-isolation.integration.spec.ts:
# två RIKTIGA authenticated-sessioner i två olika företag gör SELECT/INSERT/
# UPDATE/DELETE över varandras rader. Det är DESTRUKTIVT mot de två
# testföretagen om RLS är trasig — därför bara mot disponibla konton, och
# bara när secrets nedan är satta (annars hoppas jobbet SYNLIGT, aldrig
# tyst). Kopiera .env.integration.example för listan:
#   TENANT_TEST_SUPABASE_URL, TENANT_TEST_SUPABASE_ANON_KEY,
#   TENANT_TEST_SUPABASE_SERVICE_ROLE_KEY, TENANT_TEST_EXPECTED_PROJECT_REF,
#   TENANT_TEST_ALLOW_DESTRUCTIVE_RLS_PROBE (= YES_DELETE_DISPOSABLE_TENANTS),
#   TENANT_A_EMAIL/PASSWORD/BUSINESS_ID, TENANT_B_EMAIL/PASSWORD/BUSINESS_ID,
#   valfritt TENANT_TEST_DATABASE_URL (öppnar de två katalogkontrollerna).

name: Nattlig prod-svit

on:
  schedule:
    # 02:00 UTC = 04:00 Stockholm (sommartid) — före morgonens crons (05:00 UTC).
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full svit mot produktion
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: handymate-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, inte 20: supabase-js kräver native WebSocket (Node >=22) —
          # första grindkörningen föll på exakt detta ("Node.js 20 detected
          # without native WebSocket support"), och GitHub deprecatar
          # dessutom Node 20 på runners sedan 2025-09.
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript — noll fel
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare auth state dir
        run: mkdir -p playwright/.auth

      - name: Kontraktssviten (exkl. SMS-sändande debug-tester)
        env:
          BASE_URL: https://app.handymate.se
          TEST_USER_EMAIL: andreashogberg93@gmail.com
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_BUSINESS_ID: biz_al7pjuu5smi
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        # --grep-invert träffar de tre SMS-debug-testtitlarna
        # (tests/sms.spec.ts, tests/api.spec.ts, tests/comprehensive.spec.ts)
        # — se filhuvudet för varför de inte hör hemma i en push-grind.
        run: npx playwright test --project=setup --project=chromium --grep-invert "debug/sms|Debug SMS" --reporter=list

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: handymate-dashboard/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  tenant-isolation:
    name: Tvåtenant-RLS-bevis (riktig databas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: handymate-dashboard
    env:
      # Jobbet hoppas SYNLIGT om testföretagen inte är konfigurerade som
      # secrets — ett tyst "0 tester kördes" får aldrig se ut som grönt.
      TENANT_TEST_CONFIGURED: ${{ secrets.TENANT_A_EMAIL != '' && secrets.TENANT_B_EMAIL != '' && secrets.TENANT_TEST_ALLOW_DESTRUCTIVE_RLS_PROBE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hoppad — secrets för tvåtenantbeviset saknas
        if: env.TENANT_TEST_CONFIGURED != 'true'
        run: |
          echo "::warning::tenant-isolation HOPPAD: TENANT_A_EMAIL / TENANT_B_EMAIL / TENANT_TEST_ALLOW_DESTRUCTIVE_RLS_PROBE saknas som repo-secrets. Se filhuvudet i .github/workflows/playwright.yml."

      - name: Setup Node
        if: env.TENANT_TEST_CONFIGURED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: env.TENANT_TEST_CONFIGURED == 'true'
        # npm install, inte npm ci: package-lock.json är gitignorerad.
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: RLS-matris med två riktiga sessioner
        if: env.TENANT_TEST_CONFIGURED == 'true'
        env:
          TENANT_TEST_SUPABASE_URL: ${{ secrets.TENANT_TEST_SUPABASE_URL }}
          TENANT_TEST_SUPABASE_ANON_KEY: ${{ secrets.TENANT_TEST_SUPABASE_ANON_KEY }}
          TENANT_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TENANT_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TENANT_TEST_DATABASE_URL: ${{ secrets.TENANT_TEST_DATABASE_URL }}
          TENANT_TEST_EXPECTED_PROJECT_REF: ${{ secrets.TENANT_TEST_EXPECTED_PROJECT_REF }}
          TENANT_TEST_ALLOW_DESTRUCTIVE_RLS_PROBE: ${{ secrets.TENANT_TEST_ALLOW_DESTRUCTIVE_RLS_PROBE }}
          TENANT_A_EMAIL: ${{ secrets.TENANT_A_EMAIL }}
          TENANT_A_PASSWORD: ${{ secrets.TENANT_A_PASSWORD }}
          TENANT_A_BUSINESS_ID: ${{ secrets.TENANT_A_BUSINESS_ID }}
          TENANT_B_EMAIL: ${{ secrets.TENANT_B_EMAIL }}
          TENANT_B_PASSWORD: ${{ secrets.TENANT_B_PASSWORD }}
          TENANT_B_BUSINESS_ID: ${{ secrets.TENANT_B_BUSINESS_ID }}
        run: npm run test:tenant-isolation
